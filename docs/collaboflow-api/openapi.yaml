                          - "JSON の解析に失敗しました : 予期しない JSON string の終わり"

  /v1/permissions/groups/{group_id}:
    put:
      summary: 権限情報の登録・更新
      operationId: putPermission
      tags:
        - Permissions
      description:  |
          * ログイン済みユーザの権限情報に関しては、権限情報の更新が即時反映されないので再ログインいただく必要があります。
      parameters:
        - in: path
          description: グループの内部ID、またはグループコードを指定します。
          name: group_id
          required: true
          schema:
            type: string
        - in: query
          description: 対象グループをグループコードで指定する場合は「key=code」を指定します。<br>例：/groups/JINJI?key=code
          name: key
          schema:
            type: string
      requestBody:
        description: 登録・更新する権限情報

          * アプリケーションコード(app_cd)の指定ではマスタ管理は指定することができません。
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Permission"
                - required:
                  - code
                  - name
      responses:
        200:
          description: 更新した権限情報が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PermissionResponse"
                  - type: object
                    properties:
                      error:
                        type: boolean
                        example: false
        201:
          description: 登録した権限情報が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PermissionResponse"
                  - type: object
                    properties:
                      error:
                        type: boolean
                        example: false
        400:
          description: パラメータ指定が不正であったり、アプリケーションコードがマスタ管理で指定されてエラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - アプリケーションコードの指定は必須です。
        403:
          description: システム管理者ではないユーザーが実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - システム管理者の権限がないためアクセスできません。
        404:
          description: 存在しないグループを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 指定されたグループが存在しません。

# -----------------------------------------------
# コンポーネントの定義
# -----------------------------------------------
components:
  securitySchemes:
    ApiHeaderAuth:
      type: apiKey
      name: X-Collaboflow-Authorization
      in: header
      description:
        ユーザーパスワードまたはAPIキーによるヘッダー認証をします。<br>
        値は「Basic dGFybzpzZWNyZXQ=」のようにBASIC認証と同じ形式で指定してください。

  responses:
    UnauthorizedError:
      description: 認証ヘッダーが不足しているか無効です。

    # ----------------------------------------------------------------------------------------------
    # HTTP 400 不正な要求
    # ----------------------------------------------------------------------------------------------
    Error400BadRequest:
      description: 受信したパラメーターに問題があるため処理を中止した場合の応答です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    # ----------------------------------------------------------------------------------------------
    # HTTP 401 アクセス拒否
    # ----------------------------------------------------------------------------------------------
    Error403AccessDenied:
      description: 対象のリソースに対してアクセスできないか、指定の操作が出来ない場合の応答です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    # ----------------------------------------------------------------------------------------------
    # HTTP 404 不明なリソース
    # ----------------------------------------------------------------------------------------------
    Error404NotFound:
      description: 対象のリソースが存在しない場合の応答です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    # ----------------------------------------------------------------------------------------------
    # HTTP 409 重複／衝突
    # ----------------------------------------------------------------------------------------------
    Error409Conflict:
      description: 現在のリソース状態が競合した場合の応答です。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    # ----------------------------------------------------------------------------------------------
    # HTTP 500 サーバー内部での障害／処理失敗
    # ----------------------------------------------------------------------------------------------
    Error500ServerFailed:
      description: サーバーにて想定外のエラーが発生した場合の応答です。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - example:
                  error: true
                  messages:
                    - "不正な形式または解析中に内部エラーが発生しました"
                    - "JSON の解析に失敗しました : 予期しない JSON string の終わり"

  parameters:
    Offset:
      in: query
      name: offset
      description: 取得開始レコードのオフセットです。次ページを取得したい場合はlimitを足した値を指定します。
      schema:
        type: integer
        format: int32
        default: 0
        example: 0
    Limit:
      in: query
      name: limit
      description: 一度に取得するレコード数です。
      schema:
        type: integer
        format: int32
        default: 10
        maximum: 500
        example: 10
    Fields:
      in: query
      name: fields
      description: 受け取る情報のフィールド名を、カンマ区切りで指定します。未指定の場合は、取得可能な全ての情報が返ります。
      schema:
        type: string
        example: name,code

  schemas:
    Error:
      type: object
      required:
        - error
        - messages
      properties:
        error:
          type: boolean
          description: 処理に失敗したら true になります。
          example: true
        messages:
          type: array
          items:
            description: 失敗理由について詳細順に記載されます。
            type: string

    CommonResponse:
      type: object
      required:
        - error
        - messages
      properties:
        error:
          type: boolean
          description: 処理に失敗したら true になります。
          example: false
        messages:
          type: array
          items:
            type: string
            description: 失敗理由について詳細順に記載されます。
          example: []

    CustomizationItemJS:
      type: object
      description: JavaScriptカスタマイズファイルの種類に（type）よって、必要な項目が変わります。
      properties:
        type:
          type: string
          description: カスタマイズファイルの種類です。urlまたはfileを指定します。
          enum: [url, file]
          example: url
        url:
          type: string
          description: カスタマイズファイルのURLです。typeが「url」の場合に指定します。
          example: "https://cdn.example.com/custom-script.js"
        file_id:
          type: string
          description: アップロードしたファイルのIDです。typeが「file」の場合に指定します。
          example: "RnWSW5nLtr3F8Rw5OYoUeCJEqm_wZC5DYKYwAVlJ5H40"
      required: [type]

    CustomizationItemCSS:
      type: object
      description: CSSカスタマイズファイルの種類に（type）よって、必要な項目が変わります。
      properties:
        type:
          type: string
          description: カスタマイズファイルの種類です。urlまたはfileを指定します。
          enum: [url, file]
          example: url
        url:
          type: string
          description: カスタマイズファイルのURLです。typeが「url」の場合に指定します。
          example: "https://cdn.example.com/custom-style.css"
        file_id:
          type: string
          description: アップロードしたファイルのIDです。typeが「file」の場合に指定します。
          example: "XYZ789ABC123DEF456GHI789JKL012MNO345PQR678"
      required: [type]

    CustomizationItemWithNameJS:
      type: object
      description: JavaScriptカスタマイズファイルの種類（type）によって、返り値が異なります。
      properties:
        type:
          type: string
          description: カスタマイズファイルの種類です。urlまたはfileが返ります。
          enum: [url, file]
          example: url
        url:
          type: string
          description: カスタマイズファイルのURLです。typeが「url」の場合に返ります。
          example: "https://cdn.example.com/custom-script.js"
        file_name:
          type: string
          description: アップロードしたファイルの名前です。typeが「file」の場合に返ります。
          example: "customize.js"
        file_id:
          type: string
          description: アップロードしたファイルのIDです。typeが「file」の場合に返ります。
          example: "RnWSW5nLtr3F8Rw5OYoUeCJEqm_wZC5DYKYwAVlJ5H40"

    CustomizationItemWithNameCSS:
      type: object
      description: CSSカスタマイズファイルの種類（type）によって、返り値が異なります。
      properties:
        type:
          type: string
          description: カスタマイズファイルの種類です。urlまたはfileが返ります。
          enum: [url, file]
          example: url
        url:
          type: string
          description: カスタマイズファイルのURLです。typeが「url」の場合に返ります。
          example: "https://cdn.example.com/custom-style.css"
        file_name:
          type: string
          description: アップロードしたファイルの名前です。typeが「file」の場合に返ります。
          example: "custom-style.css"
        file_id:
          type: string
          description: アップロードしたファイルのIDです。typeが「file」の場合に返ります。
          example: "XYZ789ABC123DEF456GHI789JKL012MNO345PQR678"

    CustomizationResponse:
      type: object
      properties:
        app_cd:
          type: integer
          format: int32
          description: コラボフローアプリケーションのコードです。
          example: 1
        form_id:
          type: integer
          description: フォームIDです。
          example: 3
        form_version:
          type: integer
          description: フォームの版番号です。
          example: 1
        js:
          type: array
          description: JavaScript設定の一覧です。
          items:
            allOf:
              - $ref: "#/components/schemas/CustomizationItemWithNameJS"
        css:
          type: array
          description: CSS設定の一覧です。
          items:
            allOf:
              - $ref: "#/components/schemas/CustomizationItemWithNameCSS"

    CommonOffsetAndLimit:
      type: object
      properties:
        offset:
          description: 取得開始レコードのオフセットです。
          type: integer
          format: int32
          default: 0
          example: 0
        limit:
          description: 一度に取得するレコード数です。
          type: integer
          format: int32
          default: 10
          maximum: 500
          example: 10

    CommonTotalCount:
      type: object
      properties:
        total_count:
          description: 総レコード数です。
          type: integer
          format: int32
          example: 1

    DocumentContents:
      description: 申請書のパーツ値とパーツの状態です。
      type: object
      properties:
        'パーツID':
          $ref: "#/components/schemas/DocumentContentParts"
        'テーブルタイトル':
          $ref: "#/components/schemas/DocumentContentTableParts"

    DocumentContentTableParts:
      title: 明細項目の配列
      type: array
      items:
        allOf:
          - $ref: "#/components/schemas/DocumentContentParts"
          - type: object
            properties:
              index:
                type: integer
                format: int32
                description: 1から始まる行番号です。

    DocumentContentParts:
      title: パーツ値詳細
      type: object
      properties:
        type:
          $ref: "#/components/schemas/PartsType"
        value:
          description: パーツの値です。
          type: string
        label:
          description: パーツの項目名や書式整形後のテキストです。
          type: string
        display:
          description: 表示対象のパーツか。
          type: boolean
        writable:
          description: 書き込み可能なパーツか。
          type: boolean
        checked:
          description: チェックが付いているか。（チェックボックスパーツ専用）
          type: boolean
        link:
          description: 添付ファイルへのリンクです。
          type: string
          example: https://cloud.collaboflow.com/example/index.cfm?app_cd=1&fuseaction=clz_Download&sFileID=GPq4_HAISSQPy4y8zEuRd_cW_mGa--UArdnawjjy0Ha6

    PartsType:
      type: string
      example: text
      description: >
        パーツの種類です。以下の値をとります。

        * text - テキスト1行

        * number - テキスト1行（数値型）

        * money - テキスト1行（金額型）

        * textarea - テキスト複数行

        * date - 日付

        * time - 時刻

        * number_v2 - 数値

        * list - リストメニュー

        * checkbox - チェックボックス

        * radio - ラジオボタン

        * attachment - 添付ファイル

        * image -画像

        * lookup - マスター連携

        * calculate - 自動計算

        * excelimport - Excel添付取込

        * label - ラベル

    Document:
      description: 申請書情報です。
      type: object
      required:
        - app_cd
      properties:
        app_cd:
          description: コラボフローアプリケーションのコードです。
          type: integer
          format: int32
          example: 1
        title:
          description: 文書タイトルです。
          type: string
          minLength: 0
          maxLength: 100
          example: 稟議書
        document:
          description: 申請書情報の構造体です。省略したパーツは、デフォルト値で登録されます。
          allOf:
            - $ref: "#/components/schemas/FormParts_Text"
            - $ref: "#/components/schemas/FormParts_NumericType"
            - $ref: "#/components/schemas/FormParts_MoneyType"
            - $ref: "#/components/schemas/FormParts_TextArea"
            - $ref: "#/components/schemas/FormParts_Date"
            - $ref: "#/components/schemas/FormParts_Time"
            - $ref: "#/components/schemas/FormParts_Numeric"
            - $ref: "#/components/schemas/FormParts_ListMenu"
            - $ref: "#/components/schemas/FormParts_CheckBox"
            - $ref: "#/components/schemas/FormParts_RadioButton"
            - $ref: "#/components/schemas/FormParts_Master"
            - $ref: "#/components/schemas/FormParts_Attachment"
            - $ref: "#/components/schemas/FormParts_Image"
            - $ref: "#/components/schemas/FormTable"

    FormTable:
      type: object
      properties:
        "{TABLE_TITLE}":
          description: テーブルの行データを配列で指定します。Excelフォームの場合はテーブルタイトルに「table」を指定します。各行のデータは構造体で指定します。
          type: array
          items:
            type: object
            allOf:
              - $ref: "#/components/schemas/FormParts_Text"
              - $ref: "#/components/schemas/FormParts_NumericType"
              - $ref: "#/components/schemas/FormParts_MoneyType"
              - $ref: "#/components/schemas/FormParts_TextArea"
              - $ref: "#/components/schemas/FormParts_Date"
              - $ref: "#/components/schemas/FormParts_Time"
              - $ref: "#/components/schemas/FormParts_Numeric"
              - $ref: "#/components/schemas/FormParts_ListMenu"
              - $ref: "#/components/schemas/FormParts_CheckBox"
              - $ref: "#/components/schemas/FormParts_Master"

    FormParts_Text:
      type: object
      properties:
        "{PARTSID_Text}":
          description: テキスト（一行）ノーマルパーツのパーツIDと、値を指定します。
          type: string
          maxLength: 999
          example: サンプル文字列

    FormParts_NumericType:
      type: object
      properties:
        "{PARTSID_NumberType}":
          description: テキスト（一行）数値型パーツのパーツIDと、値を指定します。
          type: integer
          format: int32
          maximum: 999999999999999
          example: 1000

    FormParts_MoneyType:
      type: object
      properties:
        "{PARTSID_MoneyType}":
          description: テキスト（一行）金額型パーツのパーツIDと、値を指定します。
          type: integer
          format: int32
          maximum: 999999999999999
          example: 2000

    FormParts_TextArea:
      type: object
      properties:
        "{PARTSID_TextArea}":
          description: テキストエリアパーツのパーツIDと、値を指定します。
          type: string
          maxLength: 2000
          example: "サンプル\n2行目"

    FormParts_Date:
      type: object
      properties:
        "{PARTSID_Date}":
          description: 日付パーツのパーツIDと、値を「yyyy-MM-dd」またはISO8601形式で指定します。ISO8601形式で指定した場合は、日付の情報のみ登録されます。
          type: string
          format: date
          example: "2018-01-01"

    FormParts_Time:
      type: object
      properties:
        "{PARTSID_Time}":
          description: 時刻パーツのパーツIDと、値を「HH:mm」またはISO8601形式で指定します。ISO8601形式で指定した場合は、時分の情報のみ登録されます。
          type: string
          format: dateTime
          example: "12:34"

    FormParts_Numeric:
      type: object
      properties:
        "{PARTSID_Number}":
          description: 数値パーツのパーツIDと、値を指定します。
          type: integer
          format: int32
          maximum: 999999999999999
          example: 3000

    FormParts_ListMenu:
      type: object
      properties:
        "{PARTSID_ListMenu}":
          description: リストメニューパーツのパーツIDと、選択項目の値を指定します。
          type: string
          example: 選択肢A

    FormParts_CheckBox:
      type: object
      properties:
        "{PARTSID_CheckBox}":
          description: チェックボックスパーツのパーツIDと、値を指定します。チェックをONにする場合は「チェック時の表示コメント」を指定します。
          type: string
          example: 有り

    FormParts_RadioButton:
      type: object
      properties:
        "{PARTSID_RadioButton}":
          description: チェックボックスパーツのパーツIDと、選択項目の値を指定します。
          type: string
          example: 選択肢B

    FormParts_Master:
      type: object
      properties:
        "{PARTSID_Master}":
          description: マスター連携パーツのパーツIDと、値を指定します。マスターデータの存在チェックや、関連パーツへの自動データ配置は行われません。
          type: string
          example: マスターデータC

    FormParts_Attachment:
      type: object
      properties:
        "{PARTSID_Attachment}":
          description: 添付ファイルパーツのパーツIDと、ファイルIDを指定します。ファイルIDは、ファイルアップロード後のファイルID（44桁）を指定します。
          type: string
          example: GPq4_HAISSQPy4y8zEuRd_cW_mGa--UArdnawjjy0Ha6

    FormParts_Image:
      type: object
      properties:
        "{PARTSID_Image}":
          description: 画像パーツのパーツIDと、ファイルIDを指定します。ファイルIDは、ファイルアップロード後のファイルID（44桁）を指定します。
          type: string
          example: giHfLn19JgiQs9w14zA_rCvhVt-H7uLQVT-Y7XOOA2gs

    DocumentRequest:
      description: 申請時に付加する情報です。
      type: object
      properties:
        processes_id:
          description: 経路を一意に識別する内部IDです。
          type: integer
          format: int32
          example: 3
        request_userid:
          description: 申請者のユーザーIDです。未指定時の申請者は、認証したユーザーです。<br>認証したユーザーと異なるユーザーIDを指定した場合は、認証したユーザーが代理申請者になります。
          type: string
          example: taro
        request_groupcode:
          description:  |
            申請部署のグループコードです。未指定時の申請部署は、以下設定の優先順位により自動で選出されます。
            1. ユーザーによる申請部署設定
            1. 管理者によるメイングループ設定
            1. 管理者による申請部署のポリシー設定
          type: string
          example: EIGYO1

    DocumentResponse:
      description: 申請成功時に返る情報です。
      type: object
      properties:
        app_cd:
          description: コラボフローアプリケーションのコードです。
          type: integer
          format: int32
          example: 1
        processes_id:
          description: 経路を一意に識別する内部IDです。
          type: integer
          format: int32
          example: 3
        document_id:
          description: 申請書の内部IDです。
          type: integer
          format: int32
          example: 1234
        document_number:
          description: 文書番号です。
          type: string
          example: RINGI2016-003051
        title:
          description: 文書タイトルです。
          type: string
          minLength: 0
          maxLength: 100
          example: 稟議書
        request_username:
          description: 申請者の名前です。
          type: string
          example: 山田 太郎
        request_usercd:
          description: 申請者の内部IDです。
          type: string
          example: A8E8CC73D101916B8BAA3573B125C316
        request_groupname:
          description: 申請部署名です。
          type: string
          example: 営業部
        request_groupcd:
          description: 申請部署の内部IDです。
          type: string
          example: EFA45BDC0ED70E5C8CE7E80B818284DC
        represent_username:
          description: 代理申請者の名前です。
          type: string
          example: 鈴木 花子
        represent_usercd:
          description: 代理申請者の内部IDです。
          type: string
          example: 378077391759A46532E5E49759339FC2
        request_date:
          description: 申請日時です。
          type: string
          format: date
          example: "2017-04-12T02:10:51Z"
        link:
          description: 申請書を開くためのURLです。
          type: string
          example: https://cloud.collaboflow.com/example/index.cfm?app_cd=1&fuseaction=clz_TemplateProcessRequest&nPInstanceCD=1234


    DocumentOverviewResponse2:
      description: 文書の概要情報です。
      type: object
      properties:
        processes_id:
          description: 経路を一意に識別する内部IDです。
          type: integer
          format: int32
          example: 3
        form_id:
          description: フォームの内部IDです。
          type: integer
          format: int32
          example: 2
        form_version:
          description: フォームの版番号です。

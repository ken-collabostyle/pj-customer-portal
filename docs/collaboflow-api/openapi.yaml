          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                status:
                                  type: integer
                                  example: 404
                                messages:
                                  type: array
                                  items:
                                    type: string
                                  example: [指定されたユーザーが存在しません。]
                            - $ref: "#/components/schemas/User_Id"
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:

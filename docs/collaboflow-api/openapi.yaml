  /v1/files:
    post:
      summary: 添付ファイルのアップロード
      operationId: uploadFile
      description: |
        * ファイルをアップロードし、ファイルIDを取得できます。
        * 取得したファイルIDを利用し、以下のパーツや設定にファイルをアップロードすることができます。
          * 申請書の添付ファイルパーツ
          * 申請書の画像パーツ
          * フォームのカスタマイズ（JavaScript、CSS）
        * multipart/form-data形式でフィールド名は「file」で送信します。
        * 一度に複数のファイルをアップロードすることは出来ません。
        * アップロード可能なファイルのサイズは、クラウド版が30MBです。パッケージ版は、Webサーバーの設定により異なります。
        * アップロードされたファイルを申請書に添付していない場合は、31日後に削除されます。
      tags:
        - File
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        201:
          description: |
            アップロードしたファイルのファイル情報が返ります。<br>
            ファイル情報にあるファイルIDを利用し、申請書の添付ファイルパーツにファイルをアップロードすることができます。
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      id:
                        description: ファイルIDです。
                        type: string
                        example: GPq4_HAISSQPy4y8zEuRd_cW_mGa--UArdnawjjy0Ha6
                      filename:
                        description: ファイル名です。
                        type: string
                        example: 稟議書.pdf
                      created_at:
                        description: ファイルのアップロード日時です。
                        type: string
                        format: date
                        example: "2020-10-12T02:10:51Z"
                      content_type:
                        description: Content-Typeです。ファイルの内容により異なります。
                        type: string
                        example: ""
                      size:
                        description: ファイルサイズ（byte）です。
                        type: integer
                        example: 123000
                      link:
                        description: 添付ファイルのダウンロードリンクです。
                        type: string
                        example: https://cloud.collaboflow.com/example/index.cfm?app_cd=1&fuseaction=clz_Download&sFileID=GPq4_HAISSQPy4y8zEuRd_cW_mGa--UArdnawjjy0Ha6
                      error:
                        type: boolean
                        example: false
        400:
          description: ファイルが送信されていない場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                example:
                  error: true
                  messages:
                    - file フィールドを読み取れません。
                    - "理由: The form field file did not contain a file."
                  id: GPq4_HAISSQPy4y8zEuRd_cW_mGa--UArdnawjjy0Ha6

  /v1/files/{file_id}/download:
    get:
      summary: 添付ファイルのダウンロード
      operationId: downloadFile
      tags:
        - File
      parameters:
        - in: path
          description: |
            添付ファイルのファイルID（44桁）を指定します。<br>
            ファイルIDは、申請内容の詳細取得API（getDocumentContents）で取得した添付ファイルパーツの値（value）です。<br>
            クラウド版では、全ての添付ファイルに対して使用できます。<br>
            パッケージ版では、コラボフロー2.10.1より前に添付されたファイルは、ファイルIDが32桁のため使用できません。
          name: file_id
          required: true
          schema:
            type: string
      responses:
        200:
          description: |
            添付ファイルが返ります。
            Content-Typeはファイルの内容により異なります。
          content:
            image/jpeg: {}
            image/gif: {}
            image/png: {}
            text/plain: {}
            text/csv: {}
            application/pdf: {}
            application/zip: {}
            application/msword: {}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {}
            application/vnd.ms-excel: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            application/vnd.ms-powerpoint: {}
        404:
          description: ファイルが見つからない場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                example:
                  error: true
                  messages:
                    - ファイルが見つかりません。
                    - 不明なファイルIDです。
                  id: exampleFileID


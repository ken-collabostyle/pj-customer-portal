  /v1/documents/simulation/determs:
    post:
      summary: 申請内容をもとに判定者を予測
      operationId: simulateDeterms
      tags:
        - Document
      requestBody:
        description: |
          * documentパラメーターに指定された内容で申請または判定された場合の判定者を予測します。
            * パラメーターに指定した内容はデータ登録されません。
          * 申請時点の予測を行う場合は経路IDを指定します。
          * 申請済みの申請書を予測する場合は文書IDを指定します。
            * 申請書の状態が申請中・下書き保存・差し戻しの申請書のみ予測できます。
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    document_id:
                      description: 文書IDです。
                      type: integer
                      example: 1234
                - $ref: "#/components/schemas/DocumentRequest"
                - $ref: "#/components/schemas/Document"
                - $ref: "#/components/schemas/CommonOffsetAndLimit"
                - example:
                    processes_id: 3
                    request_userid: "taro"
                    request_groupcode: "EIGYO1"
                    app_cd: 1
                    document:
                      "{PARTSID_Text}": "サンプル文字列"
                      "{PARTSID_NumberType}": 1000
                      "{PARTSID_MoneyType}": 2000
                      "{PARTSID_TextArea}": |
                        サンプル
                        2行目

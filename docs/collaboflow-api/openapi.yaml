  /v1/forms/{form_id}/versions/{form_version}/settings/prints:
    get:
      summary: フォームの帳票設定を取得
      operationId: getFormSettingsPrints
      tags:
        - Form
      description:  |
          * フォームの帳票設定は、帳票出力オプションを利用されている場合のみ取得する事ができます。
          * フォームの帳票設定は、以下のユーザーのみ取得する事ができます。
            * 設定権限が付与されたグループに所属するユーザー
            * システム管理者ユーザー
      parameters:
        - in: path
          description: |
            フォームIDを指定します。
          name: form_id
          required: true
          schema:
            type: integer
        - in: path
          description: |
            フォームの版番号を指定します。<br>
            latestを指定した場合は最新バージョンを取得します。
          name: form_version
          required: true
          schema:
            type: string
          example: latest
        - in: query
          name: app_cd
          description: コラボフローアプリケーションのコードです。
          schema:
            type: integer
            format: int32
          required: true
          example: 1

      responses:
        200:
          description: フォームの帳票設定が返ります。
          content:
            application/json:
              schema:
                properties:
                  app_cd:
                    type: integer
                    format: int32
                    description: コラボフローアプリケーションのコードです。
                  error:
                    type: boolean
                  prints:
                    allOf:
                      - $ref: "#/components/schemas/FormSetting_Prints"

                example:
                  app_cd: 1
                  error: false
                  prints:
                    - id: 0
                      name: 稟議書
                      form_version: 2
                      output_item_type: ""
                      extentions: ["pdf", "excel"]
                      file_name: "稟議書_[fidSubject]"
                      print_restriction: "all"
                    - id: 1
                      name: 注文書
                      form_version: 2
                      output_item_type: "part_name"
                      extentions: ["pdf"]
                      file_name: ""
                      print_restriction: "decision"

        400:
          description: 不正なアプリケーションコードが指定された場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                存在しないアプリケーションコードを指定した場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードが不正です。
                アプリケーションコードが指定されていない場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードのパラメータが不足しています。
        403:
          description:   |
            * 帳票出力オプションライセンスが登録されていない場合の応答です。
            * 設定権限がないユーザーで実行し、エラーとなった場合の応答です。
            * 編集中のフォームIDを指定し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                帳票出力オプションライセンスが登録されていない場合:
                  value:
                    error: true
                    messages:
                      - 帳票出力オプションライセンスが登録されていません。
                設定権限がない場合:
                  value:
                    error: true
                    messages:
                      - 設定権限がありません。
                編集中のフォームIDを指定した場合:
                  value:
                    error: true
                    messages:
                      - 指定されたフォームは編集中のため、帳票設定情報を取得できません。
        404:
          description: 指定のフォームが存在しない場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                指定されたフォームと版番号が見つからない場合:
                  value:
                    error: true
                    messages:
                      - 指定されたフォームまたは版番号が見つかりません。
                フォームIDの形式が不正である場合:
                  value:
                    error: true
                    messages:
                      - フォームIDが不正です。
                版番号の形式が不正である場合:
                  value:
                    error: true
                    messages:
                      - フォーム版番号が不正です。

  /v1/forms/{form_id}/customizations:
    get:
      summary: フォームのカスタマイズ設定を取得
      operationId: getFormCustomizations
      tags:
        - Form
      description: |
        * 指定したフォームのカスタマイズ設定（JavaScript・CSS）を取得できます。
        * 以下のユーザーのみ取得する事ができます。
          * 設定権限が付与されたグループに所属するユーザー
          * システム管理者ユーザー
      parameters:
        - in: path
          description: |
            フォームIDを指定します。
          name: form_id
          required: true
          schema:
            type: integer
        - in: query
          name: app_cd
          description: コラボフローアプリケーションのコードです。
          schema:
            type: integer
            format: int32
          required: true
          example: 1
      responses:
        200:
          description: フォームのカスタマイズ設定が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CustomizationResponse"
              example:
                error: false
                app_cd: 1
                form_id: 3
                form_version: 1
                js:
                  - type: "url"
                    url: "https://cdn.example.com/custom-script.js"
                  - type: "file"
                    file_name: "customize.js"
                    file_id: "RnWSW5nLtr3F8Rw5OYoUeCJEqm_wZC5DYKYwAVlJ5H40"
                css:
                  - type: "url"
                    url: "https://cdn.example.com/custom-style.css"
                  - type: "file"
                    file_name: "custom-style.css"
                    file_id: "XYZ789ABC123DEF456GHI789JKL012MNO345PQR678"
        400:
          description: 不正なアプリケーションコードが指定された場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                存在しないアプリケーションコードを指定した場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードが不正です。
                アプリケーションコードが指定されていない場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードのパラメータが不足しています。
        403:
          description: |
            * 設定権限がないユーザーで実行し、エラーとなった場合の応答です。
            * 編集中のフォームIDを指定し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                設定権限がない場合:
                  value:
                    error: true
                    messages:
                      - 設定権限がありません。
                編集中のフォームIDを指定した場合:
                  value:
                    error: true
                    messages:
                      - 指定されたフォームは編集中のため、カスタマイズ情報を取得できません。
        404:
          description: 指定のフォームが存在しない場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              example:
                error: true
                messages:
                  - 指定されたフォームが見つかりません。
    put:
      summary: フォームのカスタマイズ設定を登録・更新
      operationId: putFormCustomizations
      tags:
        - Form
      description: |
        * 指定したフォームのカスタマイズ設定（JavaScript・CSS）を登録・更新できます。
        * 以下のユーザーのみ登録・更新する事ができます。
          * 設定権限が付与されたグループに所属するユーザー
          * システム管理者ユーザー
      parameters:
        - in: path
          description: |
            フォームIDを指定します。
          name: form_id
          required: true
          schema:
            type: integer
        - in: query
          name: app_cd
          description: コラボフローアプリケーションのコードです。
          schema:
            type: integer
            format: int32
          required: true
          example: 1
      requestBody:
        description: |-
          登録・更新するカスタマイズ情報
          * JavaScript・CSSそれぞれ最大100件まで指定可能です。
          * file_idは、添付ファイルのアップロードAPI（uploadFile）で取得したファイルidです。
          * js・cssのパラメータに空配列（[]）を指定すると既存の設定が削除されます。
          * js・cssのパラメータを省略すると既存の設定が保持されます。
        content:
          application/json:
            schema:
              type: object
              properties:
                js:
                  type: array
                  description: JavaScript設定です。
                  maxItems: 100
                  items:
                    allOf:
                      - $ref: "#/components/schemas/CustomizationItemJS"
                css:
                  type: array
                  description: CSS設定です。
                  maxItems: 100
                  items:
                    allOf:
                      - $ref: "#/components/schemas/CustomizationItemCSS"
            example:
              js:
                - type: "url"
                  url: "https://cdn.example.com/custom-script.js"
                - type: "file"
                  file_id: "RnWSW5nLtr3F8Rw5OYoUeCJEqm_wZC5DYKYwAVlJ5H40"
              css:
                - type: "url"
                  url: "https://cdn.example.com/custom-style.css"
                - type: "file"
                  file_id: "XYZ789ABC123DEF456GHI789JKL012MNO345PQR678"

      responses:
        200:
          description: 更新したフォーム情報が返ります。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  app_cd:
                    type: integer
                    format: int32
                    description: コラボフローアプリケーションのコードです。
                    example: 1
                  form_id:
                    type: integer
                    description: フォームIDです。
                    example: 3
                  form_version:
                    type: integer
                    description: フォームの版番号です。
                    example: 1
              example:
                app_cd: 1
                error: false
                form_id: 3
                form_version: 1

        400:
          description: 不正なパラメータが指定された場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                アプリケーションコードが指定されていない場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードのパラメータが不足しています。
                存在しないアプリケーションコードを指定した場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードが不正です。
                カスタマイズファイル情報が未指定の場合:
                  value:
                    error: true
                    messages:
                      - カスタマイズファイル情報が指定されていません。
                カスタマイズファイル情報のデータ型が不正な場合:
                  value:
                    error: true
                    messages:
                      - カスタマイズファイル情報のデータ型が不正です。
                typeが未指定の場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "typeの指定がされていません。"
                urlが未指定の場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "urlの指定がされていません。"
                file_idが未指定の場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "file_idの指定がされていません。"
                file_idとurlが両方指定された場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "file_idとurlの両方が指定されています。"
                不正なURLが指定された場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "https://から始まるurlを指定してください。"
                不正なfile_idが指定された場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "file_idが不正です。"
                不正な拡張子のファイルが指定された場合:
                  value:
                    error: true
                    messages:
                      - "JavaScript / CSSのカスタマイズファイル情報が不正です。"
                      - "ファイルの拡張子が「.js / .css」ではありません。"
                ファイル数が100件を超えた場合:

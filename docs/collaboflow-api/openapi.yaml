                          "{PARTSID_Time}": "12:34"
                          "{PARTSID_Number}": 3000
                          "{PARTSID_ListMenu}": "選択肢A"
                          "{PARTSID_CheckBox}": "有り"
                          "{PARTSID_Master}": "マスターデータC"
                    "offset": 0
                    "limit": 10

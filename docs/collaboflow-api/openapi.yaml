    post:
      summary: ユーザー情報の一括登録・更新
      operationId: postUsers
      tags:
        - User
      requestBody:
        description: 登録するユーザー情報

          * 対象ユーザーを、配列で指定します。

          * 配列で指定する各ユーザー情報は、1件ずつ登録する場合と同じです。

          * 登録すると自動的に内部IDが割り振られます。内部IDは、変更できません。


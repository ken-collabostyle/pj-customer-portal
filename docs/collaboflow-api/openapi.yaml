                      "{PARTSID_Time}": "12:34"
                      "{PARTSID_Number}": 3000
                      "{PARTSID_ListMenu}": "選択肢A"
                      "{PARTSID_CheckBox}": "有り"
                      "{PARTSID_RadioButton}": "選択肢B"
                      "{PARTSID_Master}": "マスターデータC"
                      "{TABLE_TITLE}":
                        - "{PARTSID_Text}": "サンプル文字列"
                          "{PARTSID_NumberType}": 1000
                          "{PARTSID_MoneyType}": 2000
                          "{PARTSID_TextArea}": |
                            サンプル
                            2行目

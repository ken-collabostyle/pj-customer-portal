openapi: "3.0.0"

info:
  version: "1.0.0"
  title: コラボフロー REST API
  contact:
    name: 株式会社コラボスタイル
  description:
    ■認証について<br>
    コラボフローAPIにアクセスするには独自の認証ヘッダー```X-Collaboflow-Authorization```をHTTPヘッダーに追加する事で行います。
    APIの実行は認証したユーザーアカウントの権限範囲内の操作のみ許可されます。例えば閲覧権限しかないユーザーは関係する申請書データを取得できますが、起案はできません。
    認証ヘッダーを用いた認証方式には2パターンあります。また、APIへのアクセスはHTTPSによる*暗号化通信を強く推奨*します。<br><br>
    **パスワード認証**<br>
    ヘッダー値に「Basic」固定文字＋半角空白＋「ログインID:パスワード」をBASE64で符号化した文字列を用いて該当ユーザーを認証します。
    主にクライアントアプリケーションを利用者に配布するなどしてログインを利用者本人にさせたい場合に有効です。<br>
    例：taroユーザーのパスワードがsecretの場合<br>
    ```X-Collaboflow-Authorization:Basic dGFybzpzZWNyZXQ=```<br>
    <br>
    **APIキー認証**<br>
    ヘッダー値に「Basic」固定文字＋半角空白＋「ログインID/apikey:発行されたAPIキー」をBASE64で符号化した文字列を用いて該当ユーザーを認証します。
    主にバッチ処理やサービスプロセスなどサーバー側でユーザー操作を代行する場合に有効です。APIキーは「システム管理＞環境設定」画面にてHTTPヘッダー認証タイプで発行します。<br>
    例：システム管理にて発行したAPIキーがWbX2jb85jBToPshdua4YfdWrNdzNDAdxで、taroユーザーとして操作したい場合<br>
    ```X-Collaboflow-Authorization:Basic dGFyby9hcGlrZXk6V2JYMmpiODVqQlRvUHNoZHVhNFlmZFdyTmR6TkRBZHg=```<br>
    <br>
    ■注意<br>
    「Try it out」で各APIを試すことができますが、POSTやPUT、DELETEメソッドを実行すると実際にデータが更新されたり削除されます。<br>
    その結果を戻すことは出来ませんので、十分に理解した上で実行ください。

# -----------------------------------------------
# APIのエンドポイント
# -----------------------------------------------
servers:
  - url: http://{hostname}/{instance}/api/index.cfm
    variables:
      hostname:
        default: localhost
        description: Webサーバーのホスト名またはIPアドレス。
      instance:
        default: collaboflow
        description: コラボフローのインスタンス名。
  - url: https://{hostname}/{instance}/api/index.cfm
    variables:
      hostname:
        default: localhost
        description: Webサーバーのホスト名またはIPアドレス。
      instance:
        default: collaboflow
        description: コラボフローのインスタンス名。
  - url: https://cloud.collaboflow.com/{instance}/api/index.cfm
    variables:
      instance:
        default: example
        description: クラウド版の契約した環境名。

# -----------------------------------------------
# API全体に適用する既定の認証
# -----------------------------------------------
security:
  - ApiHeaderAuth: []

# -----------------------------------------------
# リソースパスと操作の定義
# -----------------------------------------------
tags:
  - name: Document
    description: 申請書に関する操作
  - name: MyStatus
    description: 自分の申請書に関する操作
  - name: File
    description: 添付ファイルに関する操作
  - name: Form
    description: フォームに関する操作
  - name: User
    description: ユーザーに関する操作
  - name: Group
    description: グループに関する操作
  - name: Title
    description: 役職に関する操作
  - name: Permissions
    description: 権限に関する操作

paths:
  /v1/documents:
    post:
      summary: 申請書の申請・下書き保存
      operationId: requestDocument
      tags:
        - Document
      requestBody:
        description: |
          * {PARTSID_xxxxx} はプレースホルダーです。実際には作成したフォーム内の「パーツID」を指定してください。
          * {TABLE_TITLE} はプレースホルダーです。実際には表パーツの「テーブルタイトル」を指定してください。
            * 通常フォームでは複数のテーブルを配置できますが、テーブルタイトルは重複しないように予めフォームを準備してください。
            * Excelフォームの場合はテーブルタイトルとして、「table」を指定してください。
          * 省略したパーツは、各パーツのデフォルト値で登録されます。
          * 自動計算パーツの値は自動的に計算されて登録されるため送信不要です。
          * 複数の添付ファイルパーツ・画像パーツに同じファイルIDを指定する事はできません。
          * Excel添付取込パーツの登録には対応していません。
          * 申請せず下書きに保存する場合はアクション（下書き保存）を指定してください。下書き保存時は入力必須チェックは行われません。
        content:
          application/json:
            schema:
              required:
                - processes_id
                - document
              allOf:
                - $ref: "#/components/schemas/DocumentRequest"
                - type: object
                  properties:
                    action:
                      description: 下書き保存する場合に「draft」を指定します。申請する場合は送信不要です。
                      type: string
                      example: draft
                - $ref: "#/components/schemas/Document"
      responses:
        201:
          description: 申請された申請書に関する情報が返ります。
          headers:
            Location:
              schema:
                type: string
              description: リソースへのURIが返ります。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - $ref: "#/components/schemas/DocumentResponse"
        400:
          description: 必須項目の未入力や文字数制限の超過、無効な申請経路の指定などにより申請に失敗した場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 「品名」は必須項目です。入力を行ってください。
                          - 「金額」への入力は8文字までです。
                          - 文書を申請できませんでした。
        500:
          description: サーバーにて想定外のエラーが発生した場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "不正な形式または解析中に内部エラーが発生しました"
                          - "JSON の解析に失敗しました : 予期しない JSON string の終わり"

  /v1/documents/{document_id}:
    parameters:
      - in: path
        description: 文書IDを指定します。
        name: document_id
        schema:
          type: integer
        required: true
      - in: query
        description: コラボフローアプリケーションのコードを指定します。
        name: app_cd
        schema:
          type: integer
        required: true
    get:
      summary: 文書の概要取得
      operationId: getDocumentOverview
      tags:
        - Document
      description:  |
          * 下書き中の申請書は、以下のユーザーのみ取得する事ができます。
            * 下書きを作成したユーザー
            * 代理で下書きした場合、代理で作成したユーザー
          * 申請済みの申請書は、以下のユーザーのみ取得する事ができます。
            * 申請者本人または代理申請者
            * 判定待ちのユーザー
            * 判定を行ったユーザー
            * 監査権限が付与されたグループに所属するユーザー
            * 申請書の申請部署に所属するユーザー
              * ポリシー設定「所属部署で申請されたすべての申請を検索可能にする」がONの場合のみ
            * フォームの検索許可が設定されているグループに所属するユーザー
              * フォームの検索許可が設定されている申請書のみ
            * 文書公開経路アイテムで公開先に指定されているグループに所属するユーザー
              * 文書公開経路アイテムを通過した申請書のみ
      responses:
        200:
          description: 文書情報の概要が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DocumentOverviewResponse"
                  - type: object
                    properties:
                      error:
                        type: boolean
                        example: false

        400:
          description: 不正な文書IDやアプリケーションコードを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書IDが不正です。
                      id:
                        example: 0
        403:
          description: 閲覧できないユーザーで実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書の閲覧権限がありません。
        404:
          description: 存在しない文書IDを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "文書が見つかりませんでした。"
                          - "ErrorCode:CLZ20202"
    put:
      summary: 文書のステータス更新
      operationId: putDocumentStatus
      tags:
        - Document
      requestBody:
        description: |
          * API実行ユーザーが処理できる範囲の申請書に限りアクション（取消）を実行できます。
          * 判定者の場合は判定順番が来た時のみアクション（承認・却下・差し戻し）を実行できます。
            * アクション（取り戻し）は実行できません。
          * 申請者に差し戻しされた申請書は、申請者のみアクション（再申請）を実行できます。
          * アクション（承認・却下・差し戻し・再申請・下書きからの申請・下書きの更新）実行時に申請書の内容を更新できます。
            * documentパラメーター内のパーツID、値の指定方法は「申請書の申請（requestDocument）」を参照ください。
            * 省略したパーツは更新されません。
            * 自動計算パーツの値は自動的に計算されて更新されるため送信不要です。
            * 複数の添付ファイルパーツ・画像パーツに同じファイルIDを指定する事はできません。
            * Excel添付取込パーツの更新には対応していません。
            * 決裁された申請書の内容を更新する事は、できません。
          * アクション（差し戻し）を実行する場合は、差し戻し先の判定段階番号（phase_number）を指定してください。
            * 判定段階番号は「判定者の一覧取得（getDeterms）」にて取得できます。
          * アクション（再申請・下書きからの申請・下書きの更新）を実行する場合は、文書タイトル（title）と申請部署（request_groupcode）を更新できます。
            * 省略した場合は更新されません。
          * アクション（却下・差し戻し・取消・下書きの更新）実行時は入力必須チェックは行われません。
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DocumentStatusRequest"
                - example:
                    action: accept
                    comment: 承認します。
                    document:
                      fidRingiNo: RINGI2018-000135
                      fidKigen: 2018-9-30
                      明細:
                        - fidHinmei: "{1行目の品名}"
                          fidSuryo: "{1行目の数量}"
                        - {}
                        - fidSuryo: "{3行目の数量}"
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/DocumentStatusRequest"
      responses:
        200:
          description: ステータス更新に成功した場合のレスポンスです。
        400:
          description: コメント未入力や更新対象の文書以外を指定した場合のエラー応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 判定コメントは必須です。
                          - 文書を更新できませんでした。
        403:
          description: 閲覧できないユーザーで実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書の閲覧権限がありません。
    delete:
      summary: 文書の削除
      operationId: deleteDocument
      tags:
        - Document
      description:  |
          * 下書き中の申請書は、以下のユーザーのみ削除する事ができます。
            * 下書きを作成したユーザー
            * 代理で下書きした場合、代理で作成したユーザー
          * 申請済みの申請書は、システム管理者ユーザーのみ削除する事ができます。
          * すべての申請書を削除するためには、監査権限が付与されたグループに、システム管理者ユーザーを所属させる必要があります。
      responses:
        200:
          description: 削除した文書のIDが返ります。
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      document_id:
                        description: 文書IDです。
                        type: integer
                        format: int32
                        example: 1234
                      error:
                        type: boolean
                        example: false
        400:
          description: 不正な文書IDやアプリケーションコードを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書IDが不正です。
                      id:
                        example: 0
        403:
          description: 削除できないユーザーで実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書の削除権限がありません。
        404:
          description: 存在しない文書IDを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "文書が見つかりませんでした。"
                          - "ErrorCode:CLZ20202"

  /v1/documents/{document_id}/determs:
    get:
      summary: 判定者の一覧取得
      operationId: getDeterms
      tags:
        - Document
      description:  |
          * 申請済み申請書の判定者一覧は、以下のユーザーのみ取得する事ができます。
            * 申請者本人または代理申請者
            * 判定待ちのユーザー
            * 判定を行ったユーザー
            * 監査権限が付与されたグループに所属するユーザー
            * 申請書の申請部署に所属するユーザー
              * ポリシー設定「所属部署で申請されたすべての申請を検索可能にする」がONの場合のみ
            * フォームの検索許可が設定されているグループに所属するユーザー
              * フォームの検索許可が設定されている申請書のみ
            * 文書公開経路アイテムで公開先に指定されているグループに所属するユーザー
              * 文書公開経路アイテムを通過した申請書のみ
          * 取り戻しを行った判定者情報は取得できません。
      parameters:
        - in: path
          description: 文書IDを指定します。
          name: document_id
          schema:
            type: integer
          required: true
        - in: query
          description: コラボフローアプリケーションのコードを指定します。
          name: app_cd
          schema:
            type: integer
          required: true
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - in: query
          description: 判定待ちの段階のみ取得するかを指定します。
          name: current
          schema:
            type: boolean
          required: false
      responses:
        200:
          description: 文書情報の概要が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/DocumentDetermsResponse"
                      error:
                        type: boolean
                        example: false
                      app_cd:
                        type: integer
                        example: 1
                  - $ref: "#/components/schemas/CommonTotalCount"
                  - $ref: "#/components/schemas/CommonOffsetAndLimit"
        400:
          description: 不正な文書IDやアプリケーションコードを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書IDが不正です。
                      id:
                        example: 0
        403:
          description: 閲覧できないユーザーで実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 文書の閲覧権限がありません。
        404:
          description: 存在しない文書IDを指定して、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "文書が見つかりませんでした。"

  /v1/documents/{document_id}/contents:
    get:
      summary: 申請内容の詳細を取得
      operationId: getDocumentContents
      tags:
        - Document
      description:  |
          * 下書き中の申請書は、以下のユーザーのみ取得する事ができます。
            * 下書きを作成したユーザー
            * 代理で下書きした場合、代理で作成したユーザー
          * 申請済みの申請書は、以下のユーザーのみ取得する事ができます。
            * 申請者本人または代理申請者
            * 判定待ちのユーザー
            * 判定を行ったユーザー
            * 監査権限が付与されたグループに所属するユーザー
            * 申請書の申請部署に所属するユーザー
              * ポリシー設定「所属部署で申請されたすべての申請を検索可能にする」がONの場合のみ
            * フォームの検索許可が設定されているグループに所属するユーザー
              * フォームの検索許可が設定されている申請書のみ
            * 文書公開経路アイテムで公開先に指定されているグループに所属するユーザー
              * 文書公開経路アイテムを通過した申請書のみ
      parameters:
        - in: path
          description: 文書IDを指定します。
          name: document_id
          schema:
            type: integer
          required: true
        - in: query
          description: コラボフローアプリケーションのコードを指定します。
          name: app_cd
          schema:
            type: integer
          required: true
      responses:
        200:
          description: 申請書の各パーツの値と状態が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DocumentOverviewResponse2"
                  - type: object
                    properties:
                      app_cd:
                        type: integer
                        format: int32
                        description: コラボフローアプリケーションのコードです。
                      error:
                        type: boolean
                      contents:
                        $ref: "#/components/schemas/DocumentContents"
                  - example:
                      app_cd: 1
                      processes_id: 3
                      form_id: 2
                      form_version: 4
                      error: false
                      document_id: 1234
                      document_number: RINGI2018-00201
                      title: 稟議書
                      flow_status: flow
                      link: https://cloud.collaboflow.com/example/index.cfm?app_cd=1&fuseaction=clz_DocumentDesc&nPInstanceCD=1234
                      request_date: "2018-01-20T04:12:00Z"
                      request_group:
                        id: A2B7A80478125EB8DDDD819501E9EA3C
                        code: JINJI
                        name: 人事部
                      request_titles:
                        - id: F579D6A8747181D884A869D76D9D9AC3
                          code: butyo
                          name: 部長
                        - id: E852C223897A151C6D1CC0C3007FDA6E
                          code: katyo
                          name: 課長
                      request_user:
                        id: A8E8CC73D101916B8BAA3573B125C316
                        loginid: taro
                        name: 山田 太郎

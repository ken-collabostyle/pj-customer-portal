    DocumentStatusRequest:
      description: 文書のステータス更新に付加する情報です。
      type: object
      required:
        - action
      properties:
        action:
          description: |
            申請書に対するアクションを指定します。
            * accept - 承認します。回覧の場合は確認します。コメントを含めることができます。
            * reject - 却下します。議決の場合は否認になります。指定した場合、コメントは必須です。
            * remand - 差し戻しします。指定した場合、コメント、差し戻し先の判定段階番号は必須です。
            * takeback - 申請を取り消します。指定した場合、コメントは必須です。取り消し時に申請書の内容は更新できません。
            * rerequest - 申請者に差し戻しされた申請書を再申請します。指定した場合、コメントを含めることができません。
            * request - 下書き保存している申請書を申請します。コメントを含めることはできません。
            * draft - 下書き保存している申請書を更新します。また、申請者に差し戻しされた申請書を下書き保存します。コメントを含めることはできません。
          type: string
          example: accept
        comment:
          description: 更新時のコメントです。指定したアクションによって、必須指定になります。
          type: string
          example: 承認します。
        phase_number:
          type: integer
          format: int32
          description: |
            差し戻し先の判定段階番号です。差し戻しの場合は、必須指定になります。
            * 0 - 申請者
            * 1～ - 判定段階番号
        request_groupcode:
          description: 申請部署のグループコードです。再申請、下書きからの申請、下書きの更新時に指定した場合、更新されます。
          type: string
        title:
          description: 文書タイトルです。再申請、下書きからの申請、下書きの更新時に指定した場合、更新されます。
          type: string
        document:
          description: 申請書情報の構造体です。指定された内容でパーツが更新されます。<br>表パーツで空の構造体が指定されている場合は行の更新は行われず、構造体の指定がない場合は行が削除されます。


                      type: array
                      items:
                        allOf:
                          - $ref: "#/components/schemas/User_Id"
      responses:
        200:
          description: 指定ユーザーを全てエラーなく削除できた場合、指定ユーザーの一覧とステータスコード「200」が返ります。

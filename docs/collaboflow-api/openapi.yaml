        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        allOf:
                          - $ref: "#/components/schemas/UserPostRequest"
                          - $ref: "#/components/schemas/User_Password"
                          - required:
                            - userid
                            - name
      responses:
        200:
          description: 指定ユーザーを全てエラーなく登録・更新できた場合、指定ユーザーの一覧とステータスコード「200」または「201」が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                status:
                                  type: integer
                                  example: 200
                            - $ref: "#/components/schemas/User_Id"
                            - $ref: "#/components/schemas/User_Userid"
                      error:
                        type: boolean
                        example: false
        400:
          description: 無効な値指定などにより、エラーとなった場合の応答です。1件でもエラーとなった場合、他のユーザーの登録・更新も無効になります。
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                status:
                                  type: integer
                                  example: 400
                                messages:
                                  type: array
                                  items:
                                    type: string
                                  example: [氏名が最大40文字を超えています。]
                            - $ref: "#/components/schemas/User_Id"
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - ユーザーの登録・更新に失敗しました。
        500:
          description: サーバーにて想定外のエラーが発生した場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "不正な形式または解析中に内部エラーが発生しました"
                          - "JSON の解析に失敗しました : 予期しない JSON string の終わり"

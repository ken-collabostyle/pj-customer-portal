    PartsSetting_Date:
      allOf:
        - $ref: "#/components/schemas/PartsSetting_Common"
      type: object
      properties:
        type:
          type: string
          description: パーツの種類です。日付パーツの場合は「date」が返ります。
        default:
          type: string
          description: デフォルト値です。以下の値が返ります。

            - "" - 指定なし

            - today - 当日

            - any - 任意の日付
        any_date:
          type: string
          format: date
          description: デフォルト値の任意の日付です。defaultがany以外の場合は空が返ります。
        display_format:
          type: string
          description: 表示形式です。以下の値が返ります。

            - yyyy/m/d - 2016/3/14

            - yyyy/mm/dd - 2016/03/14

            - yyyy年m月d日 - 2016月3月14日

            - yyyy年mm月dd日 - 2016月03月14日

            - yyyy年m月d日（ddd） - 2016月3月14日（月）

            - yyyy年mm月dd日（ddd） - 2016月03月14日（月）

            - yyyy-m-d - 2016-3-14

            - yyyy-mm-dd - 2016-03-14

            - mmm-dd-yyyy - Mar-14-2016

            - short - 3/14/16

            - medium - Mar 14, 2016

            - long - March 14, 2016

            - full - Monday, March 14, 2016
        input_regulation:
          type: object
          description: 入力規制です。規制無しの場合は空の構造体が返ります。
          properties:
            diff:
              description: 差分規制です。入力規制が差分規制以外の場合は返りません。
              type: object
              properties:
                target_type:
                  type: string
                  format: date
                  description: 差分規制の対象日種別です。以下の値が返ります。

                    - request_date - 作成日

                    - determ_date - 判定日

                    - any_date - 任意の日付
                target_date:
                  type: string
                  format: date
                  description: 差分規制の任意の日付です。対象日種別（target_type）が任意の日付（any_date）以外の場合は空が返ります。
                condition_type:
                  type: string
                  description: 差分規制の条件です。以下の値が返ります。

                    - equal - 同日

                    - range - 範囲
                days:
                  type: integer
                  description: 範囲指定時の日数です。差分規制の条件（condition_type）が同日（equal）の場合は0が返ります。
                ago:
                  type: boolean
                  description: 指定された日数（days）より前とするかの値です。
                later:
                  type: boolean
                  description: 指定された日数（days）より後とするかの値です。
            range:
              type: object
              description: 範囲規制です。入力規制が範囲規制以外の場合は返りません。
              properties:
                lower_limit:
                  type: string
                  format: date
                  description: 範囲規制の下限値です。
                upper_limit:
                  type: string
                  format: date
                  description: 範囲規制の上限値です。


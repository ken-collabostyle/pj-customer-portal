  /v1/documents/search:
    post:
      summary: 申請書の検索
      operationId: searchDocument
      tags:
        - Document
      requestBody:
        description: |
          * 検索APIは、以下のユーザーのみ実行する事ができます。
            * 監査権限が付与されたグループに所属するユーザー
          * queryパラメータの記述方法については、<a href="https://collaboflow.zendesk.com/hc/ja/articles/5743816898575" target="_blank">検索APIの「query」パラメータについて</a>を参照ください。
        content:
          application/json:
            schema:
              description: 検索時に付加する情報です。
              required:
                - app_cd
              allOf:
                - type: object
                  properties:
                    app_cd:
                      description: コラボフローアプリケーションのコードです。
                      type: integer
                      format: int32
                      required: true
                      example: 1
                    query:
                      description: 申請書の検索条件をクエリで指定します。
                      type: string
                      example: form_id = 1 AND title LIKE '稟議書' AND request_user = 'taro' AND request_date >= '2022-10-01' AND request_date <= '2022-10-31' AND flow_status IN ('flow','decision') ORDER BY request_date ASC
                - $ref: "#/components/schemas/CommonOffsetAndLimit"
      responses:
        200:
          description: |
            検索結果が返ります。
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/DocumentSearchResponse"
                      error:
                        description: 処理に失敗したら true になります。
                        type: boolean
                        example: false
                      app_cd:
                        description: コラボフローアプリケーションのコードです。
                        type: integer
                        example: 1
                  - $ref: "#/components/schemas/CommonOffsetAndLimit"
                  - $ref: "#/components/schemas/CommonTotalCount"
                  - example:
                      records:
                        form_id: 1
                        form_version: 3
                        document_id: 1234
                        document_number: RINGI2022-003051
                        title: 稟議書
                        flow_status: decision
                        request_date: "2022-10-26T02:10:51Z"
                        end_date: "2022-10-27T04:13:51Z"
                        link: https://cloud.collaboflow.com/example/index.cfm?app_cd=1&fuseaction=clz_DocumentDesc&nPInstanceCD=1234
                        request_user:
                          id: A8E8CC73D101916B8BAA3573B125C316
                          loginid: taro
                          name: 山田 太郎
                        request_group:
                          id: A2B7A80478125EB8DDDD819501E9EA3C
                          code: JINJI
                          name: 人事部
                        represent_user:
                          id: 378077391759A46532E5E49759339FC2
                          loginid: hanako
                          name: 鈴木 花子
                      error: false
                      app_cd: 1
                      total_count: 1
                      offset: 0
                      limit: 10
        400:
          description: |
            * queryパラメータの解析に失敗した場合の応答です。
            * queryパラメータに指定された値が不正な場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                queryパラメータの解析に失敗した場合:
                  value:
                    error: true
                    messages:
                      - queryパラメータの解析に失敗しました。
                      - 「title」の前にANDがありません。（位置：25文字目）
                queryパラメータに指定された値が不正な場合:
                  value:
                    error: true
                    messages:
                      - queryパラメータの項目「test」は、存在しません。
        403:
          description: 監査権限が付与されたグループに所属していないユーザーが実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - 権限がありません。
        500:
          description: サーバーにて想定外のエラーが発生した場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "検索処理中にエラーが発生しました。"

  /v1/documents/{document_id}/prints/{print_id}:
    post:
      summary: 帳票出力
      operationId: outputPrint
      tags:
        - Document
      description: |
        * クラウド版専用のREST APIです。
        * 帳票出力オプションを利用されている場合のみ実行する事ができます。
        * 下書き以外の文書に対し、実行する事ができます。
          * 帳票設定の出力制限が決裁のみ許可の帳票は、決裁された文書でのみ出力可能
        * 出力ファイル形式がPDFの帳票に対し、実行する事ができます。
        * 帳票出力は、以下のユーザーのみ実行する事ができます。
          * 申請者本人または代理申請者
          * 判定を行ったユーザー
          * 監査権限が付与されたグループに所属するユーザー
          * 申請書の申請部署に所属するユーザー
            * ポリシー設定「所属部署で申請されたすべての申請を検索可能にする」がONの場合のみ
          * フォームの検索許可が設定されているグループに所属するユーザー
            * フォームの検索許可が設定されている申請書のみ
          * 文書公開経路アイテムで公開先に指定されているグループに所属するユーザー
            * 文書公開経路アイテムを通過した申請書のみ
      parameters:
        - in: path
          description: 文書IDを指定します。
          name: document_id
          schema:
            type: integer
          required: true
        - in: path
          description: 帳票IDを指定します。
          name: print_id
          schema:
            type: integer
          required: true
        - in: query
          description: コラボフローアプリケーションのコードを指定します。
          name: app_cd
          schema:
            type: integer
          required: true
      responses:
        201:
          description: |
            帳票が出力されます。
          content:
            application/pdf: {}
        400:
          description: |
            * 不正なアプリケーションコードが指定された場合の応答です。
            * 不正な文書が指定された場合の応答です。
            * 出力ファイル形式がPDFでない帳票で実行し、エラーとなった場合の応答です。
            * 決裁されていない文書で、決裁のみ許可の帳票を指定した場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                存在しないアプリケーションコードを指定した場合:
                  value:
                    error: true
                    messages:
                      - アプリケーションコードが不正です。
                存在しない文書を指定した場合:
                  value:
                    error: true
                    messages:
                      - 文書IDが不正です。
                出力ファイル形式がPDFでない場合:
                  value:
                    error: true
                    messages:
                      - PDFファイルの出力設定がされていないため、出力できません。
                決裁されていない文書で、決裁のみ許可の帳票を指定した場合:
                  value:
                    error: true
                    messages:
                      - 帳票の出力制限が決裁のみ許可のため、出力できません。
        403:
          description: |
            * パッケージ版で実行し、エラーとなった場合の応答です。
            * 帳票出力オプションライセンスが登録されていない場合の応答です。
            * 下書きの文書を指定した場合の応答です。
            * 閲覧権限のないユーザーで実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                パッケージ版で実行した場合:
                  value:
                    error: true
                    messages:
                      - パッケージ版では利用できません。
                帳票出力オプションライセンスが登録されていない場合:
                  value:
                    error: true
                    messages:
                      - 帳票出力オプションライセンスが登録されていません。
                下書きの文書を指定した場合:
                  value:
                    error: true
                    messages:
                      - 文書が下書きのため、出力できません。
                文書の閲覧権限がない場合:
                  value:
                    error: true
                    messages:
                      - 文書の閲覧権限がありません。
        404:
          description: |
            * 存在しない文書を指定して実行し、エラーとなった場合の応答です。
            * 存在しない帳票を指定して実行し、エラーとなった場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
              examples:
                文書が存在しない場合:
                  value:
                    error: true
                    messages:
                      - 文書が見つかりませんでした。
                帳票が存在しない場合:
                  value:
                    error: true
                    messages:
                      - 帳票が見つかりませんでした。
        408:
          description: 帳票出力中にタイムアウトした場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                example:
                  error: true
                  messages:
                    - タイムアウトにより処理を中断しました。印刷範囲が広い場合などに、時間が掛かる事があります。
        500:
          description: サーバーにて想定外のエラーが発生した場合の応答です。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CommonResponse"
                  - type: object
                    properties:
                      error:
                        example: true
                      messages:
                        example:
                          - "PDF生成中にエラーが発生しました。"
                          - "Error: 32789 (8015)"

